<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe & Luck</title>
    
    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* Deep midnight space blue background */
        body {
            background-color: #060814; 
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        
        /* Header styling with gold accents */
        .header {
            margin-bottom: 30px;
            margin-top: 10px;
        }
        h1 {
            color: #F9D976; 
            font-size: 28px;
            margin: 5px 0;
            letter-spacing: 1px;
            font-weight: normal;
        }
        .subtitle {
            color: #8C9BB4;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        
        /* The 2x3 Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 400px;
            margin: 0 auto;
        }
        
        /* Rounded, glowing card design */
        .card {
            background: linear-gradient(180deg, rgba(30,35,80,0.8) 0%, rgba(15,18,40,0.9) 100%);
            border: 1px solid rgba(100, 150, 255, 0.2);
            border-radius: 16px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .card:active {
            transform: scale(0.95);
        }
        
        /* Temporary glowing placeholder for your future images */
        .card-image-placeholder {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(100,150,255,0.3) 0%, rgba(0,0,0,0) 70%);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        
        /* Crisp white text for the feature names */
        .card-title {
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Vibe & Luck 🔮</h1>
        <div class="subtitle">MINI APP</div>
    </div>

    <div class="grid-container">
        
        <div class="card" onclick="alert('This will open the Daily Cards feature!')">
            <div class="card-image-placeholder">🃏</div>
            <div class="card-title">Daily Cards</div>
        </div>
        
        <div class="card" onclick="alert('This will open the Love Match feature!')">
            <div class="card-image-placeholder">❤️</div>
            <div class="card-title">Love Match</div>
        </div>
        
        <div class="card" onclick="alert('This will open Breakup Support!')">
            <div class="card-image-placeholder">💔</div>
            <div class="card-title">Breakup Support</div>
        </div>
        
        <div class="card" onclick="alert('This will open the Mood Forecast!')">
            <div class="card-image-placeholder">✨</div>
            <div class="card-title">Mood Forecast</div>
        </div>
        
        <div class="card" onclick="alert('This will open the Horoscope!')">
            <div class="card-image-placeholder">♈</div>
            <div class="card-title">Horoscope</div>
        </div>
        
        <div class="card" onclick="alert('This will open Lucky Numbers!')">
            <div class="card-image-placeholder">🎲</div>
            <div class="card-title">Lucky Numbers</div>
        </div>

    </div>
    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
